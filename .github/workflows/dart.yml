name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Generate clean Android files
      run: |
        rm -rf android ios linux macos windows web
        flutter create . --platforms=android --project-name=fitness_app

    - name: Fix Kotlin and minSdk Version
      run: |
        sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
        if [ -f "android/settings.gradle" ]; then
          sed -i 's/version ".*"/version "1.9.22"/g' android/settings.gradle || true
        fi
        if [ -f "android/build.gradle" ]; then
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.22'/" android/build.gradle || true
        fi

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
